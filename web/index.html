<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webrace</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #cfd4dd;
        font: 13px/1.5 ui-monospace, monospace;
        overflow: hidden;
      }
      #version {
        position: fixed;
        bottom: 0;
        right: 0;
        padding: 2px 6px;
        color: #fff;
        background: #7a2fa0;
        font-size: 11px;
        z-index: 99;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #fps {
        position: fixed;
        top: 8px;
        right: 10px;
        color: #9aa3b2;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #speed {
        position: fixed;
        top: calc(50% + 40px);
        left: 50%;
        transform: translateX(-50%);
        color: #ffb238;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 24px;
        opacity: 0.85;
        pointer-events: none;
      }
      #lock {
        position: fixed;
        top: 8px;
        left: 10px;
        color: #9aa3b2;
        font-size: 12px;
        pointer-events: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(11, 13, 18, 0.92);
        color: #cfd4dd;
        z-index: 10;
      }
      #overlay.hidden {
        display: none;
      }
      #status {
        color: #9aa3b2;
        font-size: 12px;
        min-height: 16px;
      }
      button {
        background: #5ce27a;
        color: #0b0d12;
        border: none;
        padding: 8px 24px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #log {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: 60vw;
        white-space: pre-wrap;
        color: #9aa3b2;
        font-size: 11px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="version">BUILD v7 — vertex-fix + pointer-lock</div>
    <div id="hud"></div>
    <div id="fps"></div>
    <div id="speed"></div>
    <div id="lock"></div>
    <div id="overlay">
      <h1>webrace</h1>
      <p id="status">loading…</p>
      <input id="map" placeholder="map name (e.g. bipracer3)" value="" />
      <button id="play">Play</button>
      <pre id="log"></pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
